# ============================================================
# ms-productos - application.properties
# Spring Boot 4.0.6 | MySQL via XAMPP
# ============================================================

server.port=8083

# CRITICO: este nombre identifica al servicio en Eureka.
# Debe coincidir EXACTAMENTE con lb://ms-productos en el Gateway.
spring.application.name=ms-productos

# ============================================================
# Conexion a MySQL (XAMPP)
# ============================================================
# Prerequisito: XAMPP corriendo con MySQL activo.
# Crear la BD antes de arrancar:
#   CREATE DATABASE db_productos CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#
# Puerto 3307 si usas XAMPP con MySQL en puerto no estandar;
# cambia a 3306 si es la instalacion estandar de MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/db_productos?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
# Dialecto MySQL 8 para Spring Boot 4 / Hibernate 6
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ddl-auto opciones:
#   create-drop -> crea tablas al iniciar, las borra al parar (ideal demos)
#   update      -> mantiene la tabla y ajusta cambios (recomendado en clase)
#   validate    -> solo valida que la tabla coincida con la entidad
#   none        -> no toca la BD (para produccion con Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update

# Muestra el SQL generado en consola (util para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Registro en Eureka
# ============================================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=127.0.0.1
eureka.instance.instance-id=127.0.0.1:${spring.application.name}:${server.port}