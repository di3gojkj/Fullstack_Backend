# ============================================================
# ms-clientes - application.properties
# Spring Boot 4.0.6 | MySQL via XAMPP
# ============================================================

server.port=8082
spring.application.name=ms-clientes

# ============================================================
# Conexion a MySQL (XAMPP)
# BD PROPIA del microservicio: db_clientes (separada de db_productos)
# Crear antes de arrancar:
#   CREATE DATABASE db_clientes CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/db_clientes?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Registro en Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=127.0.0.1
eureka.instance.instance-id=127.0.0.1:${spring.application.name}:${server.port}
