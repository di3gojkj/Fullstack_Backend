# Nombre de la aplicacion
spring.application.name=mensajeria

# Servidor: localhost. Puerto: 3306. Base de datos: mensajeria
spring.datasource.url=jdbc:mysql://localhost:3306/mensajeria

# Usuario para conectarse a MySQL.
spring.datasource.username=root
spring.datasource.password=

# Clase del controlador JDBC que permite conectarse con MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
# Valida que la estructura de las tablas coincida con las entidades.
# Hibernate no crea ni modifica tablas; esa tarea la realiza flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola las setencias SQL ejectuado por hibernate
spring.jpa.show-sql=true
# Presenta las sentencias SQL con un formato mas legible.
spring.jpa.properties.hibernate.format_sql=true

# El microservicio estara disponible en http://localhost:8082.
server.port=8082

# Habilita la ejecucion de las migraciones pendientes al iniciar.
spring.flyway.enabled=true

# Corresponde a src/mian/resources/db/migration dentro del proyecto
spring.flyway.locations=classpath:db/migration





